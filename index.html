<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>b.production</title>
  <meta name="description" content="b.production это продюсерская контора полного цикла для творческих и смешных">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a0809;
      --bg-soft: #2a1012;
      --accent: #c9a0a3;
      --cream: #f5e8e9;
      --text: #f0dede;
      --muted: #a8888a;
      --logo-dark: #48171a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Subtle texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(72, 23, 26, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(40, 10, 12, 0.6) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grunge abstract decorations */
    .deco {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
      color: #4a181b;
    }

    .deco-left {
      left: -2%;
      top: 50%;
      transform: translateY(-50%);
      width: min(32vw, 380px);
      height: auto;
    }

    .deco-right {
      right: -2%;
      top: 50%;
      transform: translateY(-50%) scaleX(-1);
      width: min(32vw, 380px);
      height: auto;
    }

    .deco-top-left {
      left: 1%;
      top: 3%;
      width: min(20vw, 200px);
      opacity: 0.5;
    }

    .deco-bottom-right {
      right: 1%;
      bottom: 3%;
      width: min(20vw, 200px);
      opacity: 0.5;
      transform: scaleX(-1) rotate(12deg);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 2.5rem;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .deco-left,
      .deco-right {
        width: 26vw;
        opacity: 0.5;
      }
      .deco-top-left,
      .deco-bottom-right {
        display: none;
      }
    }

    @media (max-width: 420px) {
      .deco-left,
      .deco-right {
        width: 24vw;
        opacity: 0.38;
      }
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 0.5rem;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      box-shadow: 
        0 0 0 1px rgba(201, 160, 163, 0.15),
        0 20px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .logo-wrap:hover img {
      transform: scale(1.03);
      box-shadow: 
        0 0 0 1px rgba(201, 160, 163, 0.3),
        0 25px 60px rgba(0, 0, 0, 0.6);
    }

    /* Title */
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      letter-spacing: 0.04em;
      color: var(--cream);
      line-height: 1.1;
    }

    h1 span {
      font-weight: 400;
      opacity: 0.85;
    }

    .tagline {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      font-weight: 300;
      color: var(--accent);
      max-width: 420px;
      letter-spacing: 0.02em;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    /* Contacts */
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
      max-width: 340px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1rem 1.5rem;
      background: rgba(42, 16, 18, 0.7);
      border: 1px solid rgba(201, 160, 163, 0.12);
      border-radius: 12px;
      text-decoration: none;
      color: var(--cream);
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .contact-item:hover,
    .contact-item:focus {
      background: rgba(72, 23, 26, 0.85);
      border-color: rgba(201, 160, 163, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .contact-item svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .contact-item .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .contact-item .value {
      font-weight: 500;
    }

    /* Footer note */
    .footer {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.7;
      letter-spacing: 0.05em;
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
        gap: 2rem;
      }

      .logo-wrap {
        width: 180px;
        height: 180px;
      }

      .contact-item {
        padding: 1.1rem 1.25rem;
        font-size: 1rem;
      }
    }

    /* Very small screens */
    @media (max-width: 360px) {
      .logo-wrap {
        width: 150px;
        height: 150px;
      }
    }

    /* Landscape mobile */
    @media (max-height: 600px) and (orientation: landscape) {
      .container {
        padding: 24px;
        gap: 1.5rem;
      }
      .logo-wrap {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
